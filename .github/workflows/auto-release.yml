name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A version is released once: bump the workspace version, merge to main, and
# this workflow creates v<version>. The tag then pins cargo-dist's build.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: version
        name: Read workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lisa-cli") | .version')"
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create version tag when needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; not retagging it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Start the tagged cargo-dist release when idle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release; not dispatching a duplicate."
            exit 0
          fi

          tag_commit="$(git rev-list -n 1 "$TAG")"
          active_run="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --commit "$tag_commit" \
              --limit 20 \
              --json databaseId,status,url \
              --jq 'map(select(.status != "completed")) | first // empty'
          )"
          if [[ -n "$active_run" ]]; then
            echo "$TAG already has an active release run; not dispatching a duplicate: $active_run"
            exit 0
          fi

          gh workflow run release.yml --ref main --field "tag=$TAG"
