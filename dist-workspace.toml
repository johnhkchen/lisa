[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.4"
# The release workflow is deliberately extended with an auto-tag dispatch path.
# Keep cargo-dist from replacing that supported customization during releases.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "homebrew"]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# The Chromebook fixture's decompressor floor is tar+gzip (Debian
# Priority: required). xz is deliberately absent there, so .tar.xz archives
# break the README one-command install at extraction time (T-046-03-03).
unix-archive = ".tar.gz"
packages = ["lisa-cli"]
# lisa-plugin is a wasm32-wasip1 cdylib; a workspace-unified cargo build drags
# it into dist's native targets, and static musl cannot produce cdylibs
# (v0.4.0 release run 29549642275). Precise builds keep dist's cargo
# invocations scoped to the distable package only.
precise-builds = true
github-build-setup = "../build-setup.yml"
install-path = "~/.local/bin"
install-success-msg = "Lisa is ready in ~/.local/bin. Open a new shell, then run lisa doctor."
tap = "johnhkchen/homebrew-lisa"
formula = "lisa"
publish-jobs = ["homebrew"]
# Homebrew has a single current formula. Lisa releases release candidates from
# main, so publish them deliberately instead of leaving the tap on an older
# stable version.
publish-prereleases = true

[[dist.extra-artifacts]]
artifacts = [
    "lisa-amd64.deb",
    "lisa-arm64.deb",
    "lisa-runtime-zellij-amd64.deb",
    "lisa-runtime-zellij-arm64.deb",
]
build = ["bash", "scripts/package-debs.sh"]
