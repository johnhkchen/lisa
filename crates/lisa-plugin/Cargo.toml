[package]
name = "lisa-plugin"
version = "0.1.0"
edition = "2021"
description = "Zellij WASM plugin for Lisa DAG-driven task scheduling"
license = "MIT"

[lib]
name = "lisa"
crate-type = ["cdylib"]

[dependencies]
lisa-core = { path = "../lisa-core" }
zellij-tile = "0.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
