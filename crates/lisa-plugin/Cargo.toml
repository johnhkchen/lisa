[package]
name = "lisa-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zellij WASM plugin for Lisa DAG-driven task scheduling"
publish = false

[lib]
name = "lisa"
crate-type = ["cdylib"]

[dependencies]
lisa-core = { path = "../lisa-core" }
zellij-tile = "0.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ascii-dag = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lisa-cli = { path = "../lisa-cli", features = ["test-support"] }
tempfile = "3"
